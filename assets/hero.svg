<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Roy Carmelli - AI Engineer, CS + Neuroscience">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07070c"/>
      <stop offset="1" stop-color="#0d0b1a"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.82" cy="0.35" r="0.45">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.12" cy="0.95" r="0.5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#67e8f9" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="380" rx="20"/></clipPath>
    <style>
      .sans { font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, 'Courier New', monospace; }
      .node { fill: #c4b5fd; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .p2 { animation-delay: .6s } .p3 { animation-delay: 1.2s } .p4 { animation-delay: 1.8s }
      @keyframes pulse { 0%,100% { opacity: .35; transform: scale(1) } 50% { opacity: 1; transform: scale(1.6) } }
      .flow { stroke-dasharray: 6 10; animation: flow 3s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -64 } }
      .dot { animation: blink 1.6s ease-in-out infinite; }
      @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
      .caret { animation: caret 1s steps(1) infinite; }
      @keyframes caret { 50% { opacity: 0 } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#grid)"/>
    <rect width="1200" height="380" fill="url(#glowA)"/>
    <rect width="1200" height="380" fill="url(#glowB)"/>

    <!-- neural graph: a nod to neurons + networks -->
    <g fill="none" stroke="#a78bfa" stroke-opacity="0.35" stroke-width="1.2">
      <path d="M760 90 L880 150 L1010 110 L1110 190"/>
      <path d="M760 90 L850 250 L980 270 L1110 190"/>
      <path d="M880 150 L850 250"/>
      <path d="M1010 110 L980 270"/>
      <path d="M880 150 L980 270"/>
      <path d="M1010 110 L850 250"/>
    </g>
    <g fill="none" stroke="url(#edge)" stroke-width="2">
      <path class="flow" d="M760 90 L880 150 L1010 110 L1110 190"/>
      <path class="flow" d="M760 90 L850 250 L980 270 L1110 190" style="animation-delay:-1.5s"/>
    </g>
    <g>
      <circle class="node pulse" cx="760" cy="90" r="5"/>
      <circle class="node pulse p2" cx="880" cy="150" r="6"/>
      <circle class="node pulse p3" cx="1010" cy="110" r="5"/>
      <circle class="node pulse p4" cx="850" cy="250" r="5"/>
      <circle class="node pulse p2" cx="980" cy="270" r="6"/>
      <circle class="node pulse" cx="1110" cy="190" r="7" fill="#67e8f9"/>
    </g>

    <!-- status pill -->
    <g>
      <rect x="64" y="62" width="222" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <circle class="dot" cx="86" cy="79" r="5" fill="#34d399"/>
      <text x="102" y="84" class="mono" font-size="14" fill="#d1fae5">open to student roles</text>
    </g>

    <text x="62" y="178" class="sans" font-size="76" font-weight="800" letter-spacing="-2.5" fill="url(#name)">Roy Carmelli</text>

    <text x="66" y="226" class="sans" font-size="24" font-weight="500" fill="#e4e4e7">AI &amp; LLM engineering · <tspan fill="#a78bfa">CS</tspan> + <tspan fill="#67e8f9">Neuroscience</tspan> @ Bar-Ilan</text>

    <g >
      <text x="66" y="292" class="mono" font-size="17" fill="#71717a"><tspan fill="#a78bfa">~/roy</tspan> <tspan fill="#52525b">$</tspan> <tspan fill="#d4d4d8">build --agents --mcp --python</tspan><tspan class="caret" fill="#67e8f9">▍</tspan></text>
      <text x="66" y="324" class="mono" font-size="15" fill="#52525b">// shipping agents that talk to models, tools and brains</text>
    </g>

    <rect x="0.5" y="0.5" width="1199" height="379" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  </g>
</svg>
